# ============================================================
# Minis Data Center - Nginx 配置
# 用法: 将此文件复制到 /etc/nginx/conf.d/minis-data-center.conf
# 注意: 需要在 /etc/nginx/nginx.conf 的 http {} 块中添加:
#       server_tokens off;
# ============================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name minis.chromeforhearts.com;

    # Let's Encrypt 验证路径（申请证书时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name minis.chromeforhearts.com;

    # SSL 证书路径（Let's Encrypt 默认路径）
    ssl_certificate     /etc/letsencrypt/live/minis.chromeforhearts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minis.chromeforhearts.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（可选，启用后浏览器会强制 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 前端静态文件根目录
    root /var/www/minis-data-center/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 启用预压缩文件（Brotli + Gzip）— vite 构建已生成 .br/.gz 文件
    gzip_static on;

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端服务
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vue Router history 模式 - 所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 访问日志
    access_log /var/log/nginx/minis-data-center.access.log;
    error_log  /var/log/nginx/minis-data-center.error.log;
}
